[pytest]
# Puts the repo root on sys.path so `from app...` resolves.
# `python -m pytest` happens to do this anyway - it prepends the working
# directory - but the bare `pytest` binary does not, so the suite passed
# locally and failed in CI with ModuleNotFoundError: No module named 'app'.
# Setting it here makes both invocations behave the same.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
